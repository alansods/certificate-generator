<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Certificate</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      color: #1a1a1a;
    }
    .frame {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 40px;
      border: 3px double #8a6d1f;
    }
    .inner {
      box-sizing: border-box;
      height: 100%;
      border: 1px solid #8a6d1f;
      padding: 50px 70px;
      text-align: center;
    }
    .eyebrow {
      letter-spacing: 6px;
      font-size: 14px;
      color: #8a6d1f;
      text-transform: uppercase;
    }
    .title {
      font-size: 40px;
      font-weight: bold;
      margin: 18px 0 6px 0;
    }
    .subtitle {
      font-size: 16px;
      color: #555555;
      margin-bottom: 28px;
    }
    .recipient {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0 24px 0;
      border-bottom: 1px solid #cccccc;
      display: inline-block;
      padding-bottom: 8px;
    }
    .course {
      font-size: 20px;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 13px;
      color: #555555;
      margin-bottom: 30px;
    }
    .footer {
      display: table;
      width: 100%;
      margin-top: 40px;
    }
    .footer-cell {
      display: table-cell;
      width: 33%;
      vertical-align: bottom;
      font-size: 12px;
      color: #555555;
    }
    .qr {
      width: 80px;
      height: 80px;
    }
    .code {
      font-size: 11px;
      color: #8a6d1f;
      letter-spacing: 1px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="inner">
      <div class="eyebrow">Certificate of Completion</div>
      <div class="title">Certificate</div>
      <div class="subtitle">This is to certify that</div>
      <div class="recipient" th:text="${recipientName}">Recipient Name</div>
      <div class="course">has successfully completed</div>
      <div class="course" th:text="${courseName}">Course Name</div>
      <div class="meta">
        <span th:text="${workloadHours}">0</span> hours &#183;
        completed <span th:text="${completionDate}">date</span> &#183;
        issued <span th:text="${issueDate}">date</span>
      </div>
      <div class="footer">
        <div class="footer-cell" style="text-align: left;">
          Instructor<br/>
          <strong th:text="${instructorName}">Instructor Name</strong>
        </div>
        <div class="footer-cell" style="text-align: center;">
          <img class="qr" th:src="${qrDataUri}" alt="Verification QR code"/>
          <div class="code" th:text="${code}">CERT-XXXX-XXXX</div>
        </div>
        <div class="footer-cell" style="text-align: right;">
          Verify at<br/>
          <strong th:text="${verifyUrl}">verify url</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
