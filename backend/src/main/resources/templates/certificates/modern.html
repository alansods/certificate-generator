<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Certificate</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      color: #10203a;
    }
    .band {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 0;
    }
    .accent {
      background-color: #1f5fbf;
      height: 22px;
      width: 100%;
    }
    .content {
      box-sizing: border-box;
      padding: 50px 80px;
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #1f5fbf;
      font-weight: bold;
    }
    .title {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0 30px 0;
    }
    .label {
      font-size: 13px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .recipient {
      font-size: 30px;
      font-weight: bold;
      margin: 4px 0 22px 0;
      color: #1f5fbf;
    }
    .course {
      font-size: 19px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 40px;
    }
    .footer {
      display: table;
      width: 100%;
    }
    .footer-cell {
      display: table-cell;
      width: 33%;
      vertical-align: bottom;
      font-size: 12px;
      color: #6b7280;
    }
    .qr {
      width: 76px;
      height: 76px;
    }
    .code {
      font-size: 11px;
      color: #1f5fbf;
      letter-spacing: 1px;
      margin-top: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="band">
    <div class="accent"></div>
    <div class="content">
      <div class="eyebrow">Certificate of Completion</div>
      <div class="title">Well done!</div>

      <div class="label">Awarded to</div>
      <div class="recipient" th:text="${recipientName}">Recipient Name</div>

      <div class="label">For completing</div>
      <div class="course" th:text="${courseName}">Course Name</div>
      <div class="meta">
        <span th:text="${workloadHours}">0</span> hours &#183;
        completed <span th:text="${completionDate}">date</span> &#183;
        issued <span th:text="${issueDate}">date</span>
      </div>

      <div class="footer">
        <div class="footer-cell" style="text-align: left;">
          Instructor<br/>
          <strong th:text="${instructorName}">Instructor Name</strong>
        </div>
        <div class="footer-cell" style="text-align: center;">
          <img class="qr" th:src="${qrDataUri}" alt="Verification QR code"/>
          <div class="code" th:text="${code}">CERT-XXXX-XXXX</div>
        </div>
        <div class="footer-cell" style="text-align: right;">
          Verify at<br/>
          <strong th:text="${verifyUrl}">verify url</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
