spring:
  application:
    name: certificate-generator
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated allowed origins. Empty/unset means no CORS mapping is registered.
    allowed-origins: ""
  jwt:
    access-token-ttl: PT15M
  refresh-token:
    ttl: P7D
  rate-limit:
    login:
      max-attempts: 5
      window: PT15M
    refresh:
      max-attempts: 20
      window: PT15M
    verify:
      max-attempts: 30
      window: PT1M
    logout:
      # Only unmatched tokens count, so this is generous for real users and still bounds an
      # anonymous flood against the one unauthenticated endpoint that touches the database.
      max-attempts: 30
      window: PT1M
  batch-import:
    max-rows: 500
