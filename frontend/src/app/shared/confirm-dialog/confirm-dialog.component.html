<div class="flex w-dialog max-w-full flex-col gap-5 rounded-lg bg-surface p-8 shadow-e3">
  <h2 class="text-md" id="confirm-dialog-title">{{ data.title }}</h2>
  <p class="m-0 text-sm text-muted" id="confirm-dialog-message">{{ data.message }}</p>
  <div class="mt-2 flex justify-end gap-3">
    <button
      type="button"
      (click)="close(false)"
      class="inline-flex min-h-(--size-touch-target) items-center rounded-md border border-neutral-600 px-6 text-sm font-medium hover:bg-neutral-900 active:bg-neutral-800"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="close(true)"
      [class]="
        data.destructive
          ? 'border-revoked-line text-revoked hover:bg-revoked-bg active:bg-revoked-bg'
          : 'border-accent-500 text-accent-500 hover:bg-accent-900 active:bg-accent-800'
      "
      class="inline-flex min-h-(--size-touch-target) items-center rounded-md border px-6 text-sm font-medium"
    >
      {{ data.confirmLabel ?? "Confirm" }}
    </button>
  </div>
</div>
