<div class="flex min-h-dvh flex-col">
  <header
    class="sticky top-0 z-5 flex h-(--size-toolbar) flex-none items-center gap-8 border-b border-divider bg-surface px-7"
  >
    <a routerLink="/certificates" class="rounded-md px-3 py-2 text-sm font-medium text-text no-underline hover:bg-accent-900 hover:text-accent-300 active:bg-accent-800">
      Certificate Generator
    </a>

    <p class="ml-auto truncate text-xs text-muted md:hidden">
      {{ currentUser()?.fullName ?? "Signed in" }}
      <span class="text-accent-300">{{ currentUser()?.role ?? "" }}</span>
    </p>

    <!-- Hidden below the medium breakpoint: the navigation still reaches the same page. -->
    <form
      (submit)="$event.preventDefault(); quickVerify()"
      class="ml-auto hidden items-center gap-3 rounded-md border border-divider py-2 pr-2 pl-4 md:flex"
    >
      <label>
        <span class="sr-only">Verify a certificate code</span>
        <input
          [formControl]="quickCode"
          placeholder="Verify code"
          [maxlength]="maxLength"
          autocomplete="off"
          spellcheck="false"
          class="w-40 border-0 bg-transparent text-xs tabular-nums text-text placeholder:text-subtle"
        />
      </label>
      <button
        type="submit"
        class="rounded-sm border border-divider px-3 py-1 text-xs text-muted hover:bg-neutral-900 active:bg-neutral-800"
      >
        Verify
      </button>
    </form>
  </header>

  <div class="flex min-h-0 flex-1 flex-col md:flex-row">
    <nav
      aria-label="Main"
      class="fixed inset-x-0 bottom-0 z-5 flex flex-none gap-1 border-t border-divider bg-surface px-4 pt-4 pb-[calc(--spacing(4)+env(safe-area-inset-bottom))] md:sticky md:top-(--size-toolbar) md:h-[calc(100dvh-var(--size-toolbar))] md:w-(--size-nav) md:flex-col md:self-start md:overflow-y-auto md:border-t-0 md:border-r md:p-4"
    >
      <p class="hidden px-4 pt-2 pb-3 text-overline tracking-wide text-subtle uppercase md:block">
        Menu
      </p>

      <a
        routerLink="/certificates"
        routerLinkActive
        #certificatesActive="routerLinkActive"
        [attr.aria-current]="certificatesActive.isActive ? 'page' : null"
        class="flex min-h-(--size-touch-target) flex-1 items-center justify-center gap-3 rounded-md px-4 text-sm text-muted no-underline not-aria-[current=page]:hover:bg-neutral-900 not-aria-[current=page]:hover:text-text not-aria-[current=page]:active:bg-neutral-800 aria-[current=page]:bg-accent-900 aria-[current=page]:text-accent-300 aria-[current=page]:active:bg-accent-800 md:flex-none md:justify-start"
      >
        <svg class="size-6 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="4" width="18" height="14" rx="2" />
          <path d="M7 9h6M7 13h4" />
        </svg>
        Certificates
      </a>

      <a
        routerLink="/verify-code"
        routerLinkActive
        #verifyActive="routerLinkActive"
        [attr.aria-current]="verifyActive.isActive ? 'page' : null"
        class="flex min-h-(--size-touch-target) flex-1 items-center justify-center gap-3 rounded-md px-4 text-sm text-muted no-underline not-aria-[current=page]:hover:bg-neutral-900 not-aria-[current=page]:hover:text-text not-aria-[current=page]:active:bg-neutral-800 aria-[current=page]:bg-accent-900 aria-[current=page]:text-accent-300 aria-[current=page]:active:bg-accent-800 md:flex-none md:justify-start"
      >
        <svg class="size-6 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M9 12l2 2 4-4" />
        </svg>
        Verify code
      </a>

      <a
        routerLink="/profile"
        routerLinkActive
        #profileActive="routerLinkActive"
        [attr.aria-current]="profileActive.isActive ? 'page' : null"
        class="flex min-h-(--size-touch-target) flex-1 items-center justify-center gap-3 rounded-md px-4 text-sm text-muted no-underline not-aria-[current=page]:hover:bg-neutral-900 not-aria-[current=page]:hover:text-text not-aria-[current=page]:active:bg-neutral-800 aria-[current=page]:bg-accent-900 aria-[current=page]:text-accent-300 aria-[current=page]:active:bg-accent-800 md:flex-none md:justify-start"
      >
        <svg class="size-6 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 20c1.5-4 4.5-6 7-6s5.5 2 7 6" />
        </svg>
        My profile
      </a>

      <button
        type="button"
        (click)="signOut()"
        class="flex min-h-(--size-touch-target) flex-1 items-center justify-center gap-3 rounded-md px-4 text-sm text-muted hover:bg-neutral-900 hover:text-text active:bg-neutral-800 md:hidden"
      >
        Sign out
      </button>

      <div class="hidden md:mt-auto md:flex md:flex-col md:gap-1">
        <div class="mx-1 my-2 h-px bg-divider" aria-hidden="true"></div>

        <div class="flex items-center gap-3 px-4 py-3">
          <span
            class="grid size-10 flex-none place-items-center rounded-full bg-accent-800 text-xs font-medium text-accent-100"
            aria-hidden="true"
          >
            {{ initials() ?? "—" }}
          </span>
          <span class="flex min-w-0 flex-col leading-tight">
            <span class="truncate text-xs">{{ currentUser()?.fullName ?? "Signed in" }}</span>
            <span class="text-overline tracking-wide text-accent-300">
              {{ currentUser()?.role ?? "" }}
            </span>
          </span>
        </div>

        <button
          type="button"
          (click)="signOut()"
          class="flex min-h-(--size-touch-target) items-center gap-3 rounded-md px-4 text-sm text-muted hover:bg-neutral-900 hover:text-text active:bg-neutral-800"
        >
          Sign out
        </button>
      </div>
    </nav>

    <!-- Bottom padding clears the fixed mobile bar; it collapses once the bar becomes a sidebar. -->
    <main class="min-w-0 flex-1 pb-[calc(var(--size-touch-target)+--spacing(8)+env(safe-area-inset-bottom))] md:pb-0">
      <router-outlet />
    </main>
  </div>

  <app-toast-host />
</div>
