<div class="relative flex min-h-dvh items-center justify-center px-7 py-14">
  <div class="accent-glow pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <div class="relative flex w-full max-w-verify flex-col gap-6">
    <h1 class="text-center text-sm font-medium">Certificate Generator</h1>

    <form (submit)="$event.preventDefault(); submit()" class="flex flex-col gap-3 rounded-lg bg-surface p-4 shadow-e1">
      <div class="flex gap-3">
        <label class="flex-1">
          <span class="sr-only">Certificate code</span>
          <input
            [formControl]="control"
            placeholder="CERT-XXXX-XXXX"
            [maxlength]="maxLength"
            autocomplete="off"
            spellcheck="false"
            [attr.aria-invalid]="showFormatError() || urlCodeMalformed()"
            [attr.aria-describedby]="showFormatError() || urlCodeMalformed() ? 'code-format-error' : null"
            class="min-h-(--size-touch-target) w-full rounded-md border bg-bg px-4 py-3 text-sm tabular-nums tracking-wide caret-accent-500 hover:border-neutral-500"
            [class.border-neutral-600]="!(showFormatError() || urlCodeMalformed())"
            [class.border-revoked]="showFormatError() || urlCodeMalformed()"
          />
        </label>
        <button
          type="submit"
          class="inline-flex min-h-(--size-touch-target) flex-none items-center rounded-md border border-accent-500 px-6 text-sm font-medium text-accent-500 hover:bg-accent-900 active:bg-accent-800"
        >
          Verify
        </button>
      </div>
      @if (showFormatError() || urlCodeMalformed()) {
        <p id="code-format-error" class="m-0 px-1 text-xs text-revoked" role="alert">
          Use the format CERT-XXXX-XXXX (letters and numbers).
        </p>
      }
    </form>

    <!-- One persistent live region: swapping the contents of an existing region announces far more
         reliably than creating the region and its content together. -->
    <app-verification-result
      [code]="urlCodeMalformed() ? '' : code()"
      [loading]="isLoading()"
      [errorKind]="errorKind()"
      [certificate]="certificate()"
      (retry)="retry()"
    />

    <p class="m-0 text-center text-xs text-subtle">
      <a routerLink="/login" class="text-accent-300 hover:underline">Sign in</a>
    </p>
  </div>
</div>
