name: Agent approval

# Approves a pull request once the review agents have signed off.
# The review agents run outside GitHub and signal completion by adding the
# "agent-approved" label. The PR author cannot approve their own PR, so the
# approval is submitted by github-actions[bot] from here.
#
# Requires: Settings > Actions > General > Workflow permissions
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  approve:
    if: github.event.label.name == 'agent-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job's own "approve" check run appears in `gh pr checks`, so
          # --watch would wait on itself and deadlock. Poll everything except it.
          for i in $(seq 1 60); do
            checks=$(gh pr checks "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --json name,state,workflow \
              -q '[.[] | select(.workflow != "Agent approval")]')

            pending=$(echo "$checks" | jq '[.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS")] | length')
            failed=$(echo "$checks" | jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED")] | length')

            if [ "$failed" -gt 0 ]; then
              echo "A required check failed:"
              echo "$checks"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All checks passed:"
              echo "$checks"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for checks to finish"
          exit 1

      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "Approved by the agent review harness: spec, backend, frontend and security reviews passed with no blockers, and CI is green."
