<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Certificate</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      color: #111111;
    }
    .content {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 60px 90px;
    }
    .rule {
      border-top: 1px solid #111111;
      width: 60px;
      margin-bottom: 24px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777777;
      margin-bottom: 30px;
    }
    .recipient {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    .course {
      font-size: 17px;
      margin-bottom: 4px;
    }
    .meta {
      font-size: 12px;
      color: #777777;
      margin-bottom: 50px;
    }
    .footer {
      display: table;
      width: 100%;
    }
    .footer-cell {
      display: table-cell;
      width: 33%;
      vertical-align: bottom;
      font-size: 11px;
      color: #777777;
    }
    .qr {
      width: 70px;
      height: 70px;
    }
    .code {
      font-size: 10px;
      color: #111111;
      letter-spacing: 1px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="rule"></div>
    <div class="eyebrow">Certificate of Completion</div>

    <div class="recipient" th:text="${recipientName}">Recipient Name</div>
    <div class="course" th:text="${courseName}">Course Name</div>
    <div class="meta">
      <span th:text="${workloadHours}">0</span> hours &#183;
      completed <span th:text="${completionDate}">date</span> &#183;
      issued <span th:text="${issueDate}">date</span>
    </div>

    <div class="footer">
      <div class="footer-cell" style="text-align: left;">
        Instructor<br/>
        <span th:text="${instructorName}">Instructor Name</span>
      </div>
      <div class="footer-cell" style="text-align: center;">
        <img class="qr" th:src="${qrDataUri}" alt="Verification QR code"/>
        <div class="code" th:text="${code}">CERT-XXXX-XXXX</div>
      </div>
      <div class="footer-cell" style="text-align: right;">
        Verify at<br/>
        <span th:text="${verifyUrl}">verify url</span>
      </div>
    </div>
  </div>
</body>
</html>
