spring:
  application:
    name: certificate-generator
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated allowed origins. Empty/unset means no CORS mapping is registered.
    allowed-origins: ""
  jwt:
    access-token-ttl: PT15M
  refresh-token:
    ttl: P7D
  auth:
    # Escape hatch: a deployment can turn self-registration off without a code change. Off means
    # POST /auth/register answers 404, not 403, so a disabled deployment doesn't advertise it.
    registration-enabled: true
  mail:
    # "logging" writes the reset link to the log instead of sending it — the only implementation
    # active in dev and in tests, so the flow works without an SMTP account. Set to "smtp" (and
    # the four properties below) once a provider is chosen; see docs/PLAN.md's deploy section.
    provider: ${APP_MAIL_PROVIDER:logging}
    from: ${APP_MAIL_FROM:}
    host: ${APP_MAIL_HOST:}
    port: ${APP_MAIL_PORT:0}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
  rate-limit:
    login:
      max-attempts: 5
      window: PT15M
    refresh:
      max-attempts: 20
      window: PT15M
    verify:
      max-attempts: 30
      window: PT1M
    logout:
      # Only unmatched tokens count, so this is generous for real users and still bounds an
      # anonymous flood against the one unauthenticated endpoint that touches the database.
      max-attempts: 30
      window: PT1M
    password-change:
      # Bounds brute-forcing currentPassword with a stolen (but still valid) access token — the
      # same threat model as login's bucket, just authenticated instead of anonymous.
      max-attempts: 5
      window: PT15M
    profile-update:
      # Bounds using the 409-vs-200 response as an email-enumeration oracle.
      max-attempts: 20
      window: PT15M
    register:
      # Unauthenticated and per client IP, like login — bounds scripting the registration table.
      max-attempts: 10
      window: PT15M
    password-reset-request-ip:
      # Bounds a script walking a list of addresses.
      max-attempts: 10
      window: PT15M
    password-reset-request-email:
      # Bounds mailbombing one known address with reset emails.
      max-attempts: 3
      window: PT15M
    password-reset-complete:
      max-attempts: 10
      window: PT15M
  batch-import:
    max-rows: 500
